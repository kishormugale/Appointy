version: 0.0
os: linux
files:
  # Maps the root of your repository artifact to the destination deployment directory on the EC2 instances
  - source: /
    destination: /opt/appointy/backend

permissions:
  # Ensures the application directory and files are properly owned by the ec2-user
  - object: /opt/appointy
    pattern: "**"
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - file
      - directory

hooks:
  # Executes the dynamic configuration and dependency installation script after the files are copied
  AfterInstall:
    - location: scripts/after-install.sh
      timeout: 300
      runas: root

  # Executes the systemd unit construction and service start script
  ApplicationStart:
    - location: scripts/application-start.sh
      timeout: 300
      runas: root

  # Optional: Verifies that the application successfully started and the health check endpoint returns 200 OK
  ValidateService:
    - location: scripts/validate-service.sh
      timeout: 180
      runas: ec2-user